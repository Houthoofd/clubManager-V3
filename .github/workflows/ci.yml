name: ClubManager CI/CD

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  backend-checks:
    name: Backend (Lint, Types & Tests)
    runs-on: ubuntu-latest
    
    # Configure MySQL service for backend tests
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_password
          MYSQL_DATABASE: clubmanager_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Lint Backend
        run: pnpm --filter clubmanager-backend run lint || echo "Lint warnings allowed for now"

      - name: Type Check Backend
        run: pnpm --filter clubmanager-backend run type-check || echo "Type warnings allowed for now"

      - name: Run Backend Tests
        run: pnpm --filter clubmanager-backend run test
        env:
          NODE_ENV: test
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_PORT: 3306
          TEST_DB_USER: root
          TEST_DB_PASSWORD: test_password
          TEST_DB_NAME: clubmanager_test

  frontend-checks:
    name: Frontend (Lint, Types, Tests & Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint Frontend
        run: pnpm --filter @clubmanager/frontend run lint || echo "Lint warnings allowed for now"

      - name: Type Check Frontend
        run: pnpm --filter @clubmanager/frontend run type-check || echo "Type warnings allowed for now"

      - name: Run Frontend Tests
        run: pnpm --filter @clubmanager/frontend run test --run

      - name: Test Frontend Build
        run: pnpm --filter @clubmanager/frontend run build
